name: Link story dependencies (one-off)

# Temporary. Adds the native "blocked by" links between the HTTP remote client
# stories (#8 to #69, 101 links). The session that filed those issues had no
# API access for issue dependencies, so this workflow adds them with
# GITHUB_TOKEN. It runs once, on the push that adds it, and the next commit on
# this branch deletes it. .claude/backlog.json reads these links
# (dependencies.style "native").
on:
  push:
    branches:
      - ccr-168dbd71-imsbp7
    paths:
      - .github/workflows/link-story-dependencies.yaml

permissions:
  issues: write

jobs:
  link:
    name: link story dependencies
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Add and verify blocked-by links
        run: |
          set -euo pipefail
          cat > stories.json <<'JSON'
          [
          {"n": 8, "title": "story(module): bootstrap the go module and in-memory http test fakes", "blockedBy": []},
          {"n": 9, "title": "story(ci): run the verify commands on every pull request", "blockedBy": [8]},
          {"n": 10, "title": "story(ident): add hashes, base32 text, the merkle fold and set ids", "blockedBy": [8]},
          {"n": 11, "title": "story(ident): add content positions and new view name validation", "blockedBy": [10]},
          {"n": 12, "title": "story(postcard): add the postcard decoder, stream reader and encoder", "blockedBy": [8]},
          {"n": 13, "title": "story(zstdframe): add zstd codecs, raw stored frames and a bounded stream reader", "blockedBy": [8]},
          {"n": 14, "title": "story(chrono): add chrono-compatible timestamp text", "blockedBy": [8]},
          {"n": 15, "title": "story(remote): add the shared remote error and server version advice", "blockedBy": [8]},
          {"n": 16, "title": "story(serverurl): add server, org base, apex and project url handling", "blockedBy": [8]},
          {"n": 17, "title": "story(wire): add the shared request pipeline for project and management clients", "blockedBy": [15, 13]},
          {"n": 18, "title": "story(syncproto): add the sync pack and wants wire codec", "blockedBy": [12, 13]},
          {"n": 19, "title": "story(views): parse and write remote view inventory rows", "blockedBy": [10]},
          {"n": 20, "title": "story(views): add view manifests and canonical view snapshots", "blockedBy": [19]},
          {"n": 21, "title": "story(project): add the project client with sync push and pull", "blockedBy": [16, 17, 18]},
          {"n": 22, "title": "story(project): add the view inventory and project identity requests", "blockedBy": [21, 19]},
          {"n": 23, "title": "story(project): download change files by hash", "blockedBy": [21, 10]},
          {"n": 24, "title": "story(projecttest): add an in-memory project server for sync tests", "blockedBy": [18, 20]},
          {"n": 25, "title": "story(changefile): add the v3 change file header, sections and hash table types", "blockedBy": [10]},
          {"n": 26, "title": "story(changefile): read and verify change files", "blockedBy": [25, 13]},
          {"n": 27, "title": "story(changefile): write change files and splice unhashed sections", "blockedBy": [26]},
          {"n": 28, "title": "story(change): add the change header, author and origin types", "blockedBy": [8]},
          {"n": 29, "title": "story(change): decode and encode change headers and dependencies", "blockedBy": [28, 25, 12, 14]},
          {"n": 30, "title": "story(tags): encode tag records and compute their object keys", "blockedBy": [28, 10, 12, 14]},
          {"n": 31, "title": "story(syncflow): read ref advertisements, resolve view chains and verify object keys", "blockedBy": [20, 30, 26, 18]},
          {"n": 32, "title": "story(syncflow): plan a push, build its pack and verify the result", "blockedBy": [31]},
          {"n": 33, "title": "story(syncflow): drive a complete push against a remote", "blockedBy": [32, 22, 24]},
          {"n": 34, "title": "story(identity): add ed25519 public keys, identity ids and dids", "blockedBy": [10]},
          {"n": 35, "title": "story(identity): add signers and signed registration bodies", "blockedBy": [34, 14]},
          {"n": 36, "title": "story(canonical): add json canonicalization and i-json admission", "blockedBy": [8]},
          {"n": 37, "title": "story(canonical): add data integrity proofs and content hashes", "blockedBy": [36, 35]},
          {"n": 38, "title": "story(token): mint and verify bearer tokens", "blockedBy": [35]},
          {"n": 39, "title": "story(delegation): add permissions, scopes and delegation ids", "blockedBy": [34]},
          {"n": 40, "title": "story(delegation): issue, parse and verify delegation certificates", "blockedBy": [37, 39]},
          {"n": 41, "title": "story(delegation): add revocations and delegation requests", "blockedBy": [40]},
          {"n": 42, "title": "story(delegation): choose the certificate to present and check permissions locally", "blockedBy": [40]},
          {"n": 43, "title": "story(projectidentity): read, hash, sign and verify project identity documents", "blockedBy": [37]},
          {"n": 44, "title": "story(auth): add the origin-scoped credential transport", "blockedBy": [8]},
          {"n": 45, "title": "story(auth): select the identity for a remote and check push credentials", "blockedBy": [44, 40, 16]},
          {"n": 46, "title": "story(auth): mint per-request bearer credentials for a remote", "blockedBy": [45, 38, 42]},
          {"n": 47, "title": "story(storage): add the management api client pipeline", "blockedBy": [17]},
          {"n": 48, "title": "story(storage): manage workspaces and projects", "blockedBy": [47]},
          {"n": 49, "title": "story(storage): resolve identities by email, name, key and did", "blockedBy": [47, 34]},
          {"n": 50, "title": "story(storage): register an identity with a server", "blockedBy": [47, 35]},
          {"n": 51, "title": "story(storage): create, list and manage organizations", "blockedBy": [47]},
          {"n": 52, "title": "story(storage): manage organization members and domains", "blockedBy": [51]},
          {"n": 53, "title": "story(storage): enroll agents and publish or revoke delegations", "blockedBy": [47, 41]},
          {"n": 54, "title": "story(storage): manage teams and team members", "blockedBy": [47]},
          {"n": 55, "title": "story(storage): list, add and revoke org and workspace grants", "blockedBy": [47]},
          {"n": 56, "title": "story(legacy): add the legacy query-string reads", "blockedBy": [21, 19]},
          {"n": 57, "title": "story(legacy): add the legacy query-string writes", "blockedBy": [56]},
          {"n": 58, "title": "story(legacy): add layer downloads, chunk manifests and chunk negotiation", "blockedBy": [56]},
          {"n": 59, "title": "story(provenance): decode and encode provenance records in the current layout", "blockedBy": [12, 10]},
          {"n": 60, "title": "story(provenance): read historical provenance layouts with rust's fallback orders", "blockedBy": [59]},
          {"n": 61, "title": "story(span): decode and encode span patches", "blockedBy": [12, 10]},
          {"n": 62, "title": "story(graph): decode and encode compact graph types and the content ops", "blockedBy": [12, 25]},
          {"n": 63, "title": "story(graph): add the conflict, root and attribute graph ops with their reader checks", "blockedBy": [62]},
          {"n": 64, "title": "story(graph): resolve, check and remap graph hash indices", "blockedBy": [63]},
          {"n": 65, "title": "story(semantic): decode and encode semantic section payloads", "blockedBy": [62, 61]},
          {"n": 66, "title": "story(change): sign change files and verify change signatures", "blockedBy": [29, 27, 35]},
          {"n": 67, "title": "story(change): decode and validate whole change files", "blockedBy": [66, 60, 64, 65]},
          {"n": 68, "title": "story(change): encode changes in atomic's canonical layout", "blockedBy": [67]},
          {"n": 69, "title": "story(syncflow): add an authenticated end-to-end push example", "blockedBy": [33, 46]}
          ]
          JSON

          # 1. Refuse to link anything unless every number holds the expected story.
          bad=0
          while IFS=$'\t' read -r n want; do
            got=$(gh api "repos/$REPO/issues/$n" --jq .title)
            if [ "$got" != "$want" ]; then
              echo "::error title=Unexpected issue::#$n is '$got', expected '$want'"
              bad=1
            fi
          done < <(jq -r '.[] | "\(.n)\t\(.title)"' stories.json)
          [ "$bad" -eq 0 ] || exit 1

          # 2. Add each link once; links that already exist are skipped.
          failed=0
          while read -r n b; do
            if gh api --paginate "repos/$REPO/issues/$n/dependencies/blocked_by" --jq '.[].number' | grep -qx "$b"; then
              echo "#$n already blocked by #$b"
              continue
            fi
            id=$(gh api "repos/$REPO/issues/$b" --jq .id)
            if gh api -X POST "repos/$REPO/issues/$n/dependencies/blocked_by" -F issue_id="$id" --silent; then
              echo "#$n blocked by #$b"
            else
              echo "::error title=Link failed::#$n blocked by #$b"
              failed=$((failed + 1))
            fi
          done < <(jq -r '.[] | .n as $n | .blockedBy[] | "\($n) \(.)"' stories.json)

          # 3. Every story's blockers must be exactly the planned set.
          mismatched=0
          while read -r n want; do
            got=$(gh api --paginate "repos/$REPO/issues/$n/dependencies/blocked_by" --jq '.[].number' | sort -n | paste -sd, -)
            if [ "$got" != "$want" ]; then
              echo "::error title=Links differ::#$n is blocked by [$got], expected [$want]"
              mismatched=$((mismatched + 1))
            fi
          done < <(jq -r '.[] | "\(.n) \(.blockedBy | sort | map(tostring) | join(","))"' stories.json)

          echo "failed links: $failed, issues with wrong links: $mismatched"
          [ "$failed" -eq 0 ] && [ "$mismatched" -eq 0 ]
